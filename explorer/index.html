<div class="app" id="app" data-menu="wide" data-theme="light" data-review="off" data-pfa="off" data-variant="__VARIANT__">
  <aside class="side" id="side" aria-label="Menu"></aside>
  <div class="main">
    <header class="top" id="top">
      <label class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13z"/><path d="M15.5 15.5L20 20"/></svg><input id="q" type="search" autocomplete="off" autocapitalize="off" placeholder="Search statements and small steps  ( press / )" aria-label="Search statements and small steps"></label>

      <button class="tbtn" id="thbtn" data-act="theme" title="Light or dark"></button>
      <button class="tbtn" id="fsbtn" data-act="full"></button>
      <button class="tbtn" id="prbtn" data-act="print" title="Print this list on A4" hidden></button>
      <button class="tbtn" id="rvbtn" data-act="review" title="Review mode: leave notes on any page as you browse" hidden></button>
    </header>
    <!-- On paper this is a table whose header and footer rows repeat on every page and keep the
         content inside the green-and-gold frame. On screen its parts have no box of their own. -->
    <table class="sheet" role="presentation">
      <thead><tr><td class="sheet-space"></td></tr></thead>
      <tbody><tr><td class="sheet-body"><main class="view" id="view"></main></td></tr></tbody>
      <tfoot><tr><td class="sheet-space"></td></tr></tfoot>
    </table>
  </div>
  <div class="rvbar" id="rvbar" hidden role="region" aria-label="Review mode"></div>
  <aside class="rvpanel" id="rvpanel" hidden aria-label="Note on this page"></aside>
  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
</div>
